# Releases FancyZonesClone when a v* tag is pushed (v1.2.0 releases version 1.2.0). The tag is the only place the
# version is set: MinVer reads it at build time, and the GitHub release gets notes generated from the pull requests
# merged since the previous tag.
name: Release

on:
  push:
    tags:
      - 'v*'

# No default token permissions: each job asks for only what it needs.
permissions: {}

env:
  # Avalonia.BuildServices and Microsoft.Testing.Platform report usage unless told not to.
  AVALONIA_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # Runs NuGet package code (MSBuild targets, analysers, source generators, the ILCompiler, and the test host), so it
  # gets a read-only token and doesn't persist it in .git/config.
  build:
    name: Build & test
    # Windows, because the Native AOT link step needs the MSVC toolchain, which windows-latest provides.
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      # Full history: MinVer needs the tags, and the main check below needs origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only release commits that reached main through review and CI.
      - name: Check tagged commit is on main
        run: |
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::$env:GITHUB_REF_NAME points at $env:GITHUB_SHA, which isn't on main"
            exit 1
          }

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release -warnaserror
      - run: dotnet test --no-build --configuration Release
      - run: dotnet publish src/FancyZonesClone --configuration Release --runtime win-x64

      # MinVer falls back to 0.0.0-alpha.0 without failing when it finds no tag, so check the exe carries the
      # tag's version before releasing it.
      - name: Check executable version matches tag
        run: |
          $expected = "$env:GITHUB_REF_NAME".Substring(1)
          $exe = "artifacts/publish/FancyZonesClone/release_win-x64/FancyZonesClone.exe"
          $actual = ((Get-Item $exe).VersionInfo.ProductVersion -split '\+')[0]
          if ($actual -ne $expected) {
            Write-Output "::error::FancyZonesClone.exe is version $actual, expected $expected"
            exit 1
          }

      - name: Package
        run: |
          $version = "$env:GITHUB_REF_NAME".Substring(1)
          $publish = "artifacts/publish/FancyZonesClone/release_win-x64"
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md $publish
          Compress-Archive -Path "$publish/FancyZonesClone.exe", "$publish/*.dll", "$publish/LICENSE", "$publish/THIRD-PARTY-NOTICES.md" `
            -DestinationPath "artifacts/release/FancyZonesClone-$version-win-x64.zip"

      # Lists every package in the win-x64 graph with its version, licence, and hash, so an approver can see what's
      # inside a release without rebuilding it. Build-only packages, such as MinVer and the ILCompiler, get scope
      # "excluded". Avalonia.BuildServices is left out because it's a build-time telemetry task that never ships.
      - name: Write SBOM
        run: |
          $version = "$env:GITHUB_REF_NAME".Substring(1)
          dotnet tool restore
          dotnet CycloneDX src/FancyZonesClone/FancyZonesClone.csproj --recursive --runtime win-x64 `
            --exclude-filter Avalonia.BuildServices --disable-package-restore `
            --set-name FancyZonesClone --set-version $version --output-format Json `
            --output artifacts/release --filename "FancyZonesClone-$version-win-x64.cdx.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: artifacts/release
          retention-days: 90

  # Holds the write token and the attestation identity, and runs no package code: it only checksums, attests, and
  # publishes the zip and SBOM that build uploaded.
  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: artifacts/release

      - name: Write SHA256SUMS
        working-directory: artifacts/release
        run: sha256sum -- *.zip *.cdx.json > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/release/*.zip

      - name: Create GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/release/*.zip artifacts/release/*.cdx.json \
            artifacts/release/SHA256SUMS \
            --verify-tag --generate-notes --title "FancyZonesClone ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
