# Checks the release build is reproducible: it AOT-publishes one ref on two separate runners and compares the SHA-256
# of every published exe and DLL. Run it on a tag before you trust a rebuild to match that release's download.
name: Reproducibility

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Tag, branch, or commit to rebuild
        required: true
        default: main
  # Checks changes to this workflow by rebuilding the pull request's own commit.
  pull_request:
    paths:
      - .github/workflows/reproducible.yml

permissions: {}

env:
  # Avalonia.BuildServices reports usage unless told not to.
  AVALONIA_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  publish:
    name: Publish (${{ matrix.run }})
    # Windows, because the Native AOT link step needs the MSVC toolchain, which windows-latest provides.
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        run: [a, b]
    defaults:
      run:
        shell: pwsh
    steps:
      # Full history: MinVer needs the tags to version the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }} # empty on pull_request, which checks out the pull request's commit
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      # The same publish command as release.yml.
      - run: dotnet publish src/FancyZonesClone --configuration Release --runtime win-x64

      - name: Hash published files
        run: |
          $publish = "artifacts/publish/FancyZonesClone/release_win-x64"
          Get-ChildItem $publish -File -Include *.exe, *.dll -Recurse |
            Sort-Object Name |
            ForEach-Object { "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content -Encoding ascii artifacts/SHA256SUMS
          Get-Content artifacts/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-${{ matrix.run }}
          path: |
            artifacts/SHA256SUMS
            artifacts/publish/FancyZonesClone/release_win-x64/*.exe
            artifacts/publish/FancyZonesClone/release_win-x64/*.dll
          retention-days: 14

  compare:
    name: Compare
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: publish-*
      # Keeps both builds as artefacts, so you can diff the binaries when the hashes differ.
      - name: Compare hashes
        # Through env, not ${{ }} in the script, so a crafted ref can't inject shell.
        env:
          REF: ${{ inputs.ref || github.sha }}
        run: |
          if diff -u publish-a/SHA256SUMS publish-b/SHA256SUMS; then
            echo "::notice::$REF rebuilt byte for byte on two runners"
          else
            echo "::error::$REF didn't rebuild byte for byte; download publish-a and publish-b to diff them"
            exit 1
          fi
