name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

env:
  # Avalonia.BuildServices and Microsoft.Testing.Platform report usage unless told not to.
  AVALONIA_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    # Windows, because the Native AOT link step needs the MSVC toolchain, which windows-latest provides.
    runs-on: windows-latest
    steps:
      # Full history: MinVer needs the tags to version the build.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Restore and build run NuGet package code, so don't leave the token in .git/config for it.
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release -warnaserror
      - run: dotnet test --no-build --configuration Release --report-trx --coverage --coverage-output-format cobertura --results-directory artifacts/test-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: artifacts/test-results
      # The app ships only as Native AOT, and trimming and reflection-free serialisation change behaviour that the
      # managed run can't see, so compile the tests natively and run them too. The test project sets IsPublishable
      # to false, which this lane overrides.
      - run: dotnet publish tests/FancyZonesClone.Core.Tests --no-restore --configuration Release -p:IsPublishable=true
      - run: ./artifacts/publish/FancyZonesClone.Core.Tests/release/FancyZonesClone.Core.Tests.exe
      # Proves the Native AOT build still links on every change, which can't be checked without MSVC locally.
      # The app project sets RuntimeIdentifier to win-x64, so the build above is already the win-x64 build, and
      # this step compiles those assemblies natively without rebuilding them. Releases come from release.yml.
      - run: dotnet publish src/FancyZonesClone --no-build --configuration Release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FancyZonesClone-win-x64-unreleased
          path: |
            artifacts/publish/FancyZonesClone/release_win-x64/FancyZonesClone.exe
            artifacts/publish/FancyZonesClone/release_win-x64/*.dll

  # A job of its own, so it reports in about a minute, and a formatting difference never hides build's test results
  # or the Native AOT publish. Linux is enough: EnableWindowsTargeting restores the Windows projects here.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: MinVer needs the tags to version the build.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet format --no-restore --verify-no-changes
